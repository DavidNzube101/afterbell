openapi: 3.1.0
info:
  title: Afterbell Trading API
  version: 0.1.0
  description: Health, market data, oracle publication, and owner-authorized A1 trade execution.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Markets
  - name: Trading
  - name: Otto
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the API process is running
      responses:
        '200':
          description: API process is live
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: live }
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether the API can reach PostgreSQL
      responses:
        '200':
          description: API and database are ready
          content:
            application/json:
              schema:
                type: object
                required: [status, database, indexer]
                properties:
                  status: { type: string, const: ready }
                  database: { type: string, const: ready }
                  indexer:
                    $ref: '#/components/schemas/IndexerStatus'
        '503':
          description: Database is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status, database, indexer, error]
                properties:
                  status: { type: string, const: unavailable }
                  database: { type: string, const: unavailable }
                  indexer:
                    $ref: '#/components/schemas/IndexerStatus'
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string, const: database_unavailable }
                      message: { type: string }
  /health/status:
    get:
      tags: [Health]
      operationId: getServiceStatus
      summary: Report API, database, and background indexer status
      description: Indexer errors are reported here while the HTTP API remains ready if PostgreSQL is available.
      responses:
        '200':
          description: Current service component status
          content:
            application/json:
              schema:
                type: object
                required: [status, api, database, indexer]
                properties:
                  status: { type: string, enum: [ready, degraded] }
                  api: { type: string, const: running }
                  database: { type: string, enum: [ready, unavailable] }
                  indexer:
                    $ref: '#/components/schemas/IndexerStatus'
  /v1/markets:
    get:
      tags: [Markets]
      operationId: listMarkets
      summary: List configured Robinhood Chain stock markets
      description: These markets are development-only and are not enabled for trading.
      responses:
        '200':
          description: Configured market registry
          content:
            application/json:
              schema:
                type: object
                required: [network, contractId, markets, tradingEnabled]
                properties:
                  network: { type: string, enum: [testnet, mainnet] }
                  contractId: { type: string }
                  tradingEnabled: { type: boolean, const: false }
                  markets:
                    type: array
                    items:
                      type: object
                      required: [id, symbol, baseAsset, quoteAsset, sourceChain, sourceChainId, tokenAddress, status, tradingEnabled]
                      properties:
                        id: { type: string, example: NVDA }
                        symbol: { type: string, example: NVDA }
                        baseAsset: { type: string }
                        quoteAsset: { type: string, const: USDC }
                        sourceChain: { type: string, const: robinhood }
                        sourceChainId: { type: integer, const: 4663 }
                        tokenAddress: { type: string }
                        status: { type: string, const: development }
                        tradingEnabled: { type: boolean, const: false }
  /v1/otto/providers:
    get:
      tags: [Otto]
      operationId: getOttoProviders
      summary: Get configured Otto provider availability
      responses:
        '200':
          description: Provider availability and configured model IDs; API keys are never returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  near_ai: { $ref: '#/components/schemas/OttoProviderStatus' }
                  qwen: { $ref: '#/components/schemas/OttoProviderStatus' }
                  byok: { $ref: '#/components/schemas/OttoProviderStatus' }
  /v1/otto/chat:
    post:
      tags: [Otto]
      operationId: streamOttoChat
      summary: Stream an Otto response
      description: Streams OpenAI-compatible chat deltas as Server-Sent Events. Platform API keys remain server-side. BYOK credentials are accepted for this request only and are not persisted. Requests are limited to twelve per minute per supplied account ID; wallet ownership is not verified by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, account_id, market_id, messages]
              properties:
                provider: { type: string, enum: [near_ai, qwen, byok] }
                account_id: { type: string, maxLength: 128 }
                market_id: { type: string, enum: [AAPL, GOOGL, META, NVDA, TSLA] }
                messages:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string, maxLength: 4000 }
                base_url: { type: string, description: Required for BYOK; HTTPS only, port 443, public DNS host, root or /v1 path. }
                model: { type: string, description: Required for BYOK. }
                api_key: { type: string, writeOnly: true, description: Required for BYOK; request-scoped and never persisted. }
      responses:
        '200':
          description: Server-Sent Events; event names are delta, done, and error.
          content:
            text/event-stream:
              schema: { type: string }
        '400':
          description: Invalid provider, market, or message payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Otto request limit reached for the supplied account ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Selected platform provider is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/trade/quote:
    post:
      tags: [Trading]
      operationId: createPerpOpenQuote
      summary: Create an A1-signed market-open quote
      description: Returns the exact A1 authorization message for the owner wallet to sign, along with the configured quote signer signature. The backend preflights current account, market, portfolio, and vault capacity before returning a quote. Amounts are raw USDC units (6 decimals). The quote expires quickly and is bound to the current oracle sequence and trading nonce.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, market_id, side, notional_usdc, leverage_bps, max_slippage_bps]
              properties:
                account_id: { type: string }
                market_id: { type: string, example: NVDA }
                side: { type: string, enum: [long, short] }
                notional_usdc: { type: string, pattern: '^[0-9]+$', example: '10000000' }
                leverage_bps: { type: integer, minimum: 10000, example: 20000 }
                max_slippage_bps: { type: integer, minimum: 0, maximum: 1000, example: 50 }
      responses:
        '200':
          description: Quote and owner-signing message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeQuote' }
        '422':
          description: Market, oracle, account, balance, or request validation failed. A risk_capacity_exceeded error includes error.allowed_max_notional_usdc in raw USDC units.
  /v1/trade/open:
    post:
      tags: [Trading]
      operationId: submitPerpOpen
      summary: Relay an owner-authorized A1 market order
      description: Send the quote fields returned by /v1/trade/quote plus the owner's base64 wallet signature. The backend checks that the quote is still current, applies the configured quote signer signature, and relays open_perp_position to A1. A1 remains authoritative for signature verification and settlement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TradeQuote'
                - type: object
                  required: [owner_signature]
                  properties:
                    owner_signature: { type: string, contentEncoding: base64 }
      responses:
        '200':
          description: NEAR transaction finalized
          content:
            application/json:
              schema:
                type: object
                required: [status, transaction_hash, position_id]
                properties:
                  status: { type: string, const: finalized }
                  transaction_hash: { type: string }
                  position_id: { type: string }
        '422': { description: Quote expired or A1 rejected the trade }
        '503': { description: Trade routes are disabled }
  /v1/trade/positions:
    get:
      tags: [Trading]
      operationId: listPerpPositions
      summary: List the current A1 positions for a logical account
      parameters:
        - name: account_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current positions, with indicative PnL when a market mark exists
          content:
            application/json:
              schema:
                type: object
                required: [account_id, positions]
                properties:
                  account_id: { type: string }
                  positions: { type: array, items: { type: object } }
  /v1/trade/close/quote:
    post:
      tags: [Trading]
      operationId: createPerpCloseQuote
      summary: Create an A1-signed position close quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, position_id, max_slippage_bps]
              properties:
                account_id: { type: string }
                position_id: { type: string }
                max_slippage_bps: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        '200':
          description: Quote and owner-signing message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloseQuote' }
        '422': { description: Position or oracle validation failed }
  /v1/trade/close:
    post:
      tags: [Trading]
      operationId: submitPerpClose
      summary: Relay an owner-authorized position close
      description: Send the close quote plus the owner's base64 wallet signature. The backend rechecks current position, mark, sequence and nonce before relaying close_perp_position to A1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CloseQuote'
                - type: object
                  required: [owner_signature]
                  properties:
                    owner_signature: { type: string, contentEncoding: base64 }
      responses:
        '200': { description: Close transaction finalized }
        '422': { description: Quote expired or A1 rejected the close }
        '503': { description: Trade routes are disabled }
  /v1/trade/limits:
    get:
      tags: [Trading]
      operationId: listPerpLimitOrders
      summary: List standing limit orders for a logical account
      parameters:
        - name: account_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Standing orders recorded by A1
          content:
            application/json:
              schema: { type: object, properties: { orders: { type: array, items: { type: object } } } }
    post:
      tags: [Trading]
      operationId: submitPerpLimitOrder
      summary: Place a wallet-authorized standing limit order
      description: Submit the fields returned by /v1/trade/limits/quote and the owner's signature. A1 stores the authorization. A backend keeper submits it when the A1 mark reaches its limit. No margin is reserved while it waits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [account_id, order_id, market_id, side, notional_usdc, leverage_bps, limit_price, nonce, expires_at_ms, message, owner_signature] }
      responses:
        '200': { description: Limit order stored on A1 }
        '422': { description: Invalid or stale authorization }
  /v1/trade/limits/quote:
    post:
      tags: [Trading]
      operationId: createPerpLimitOrderAuthorization
      summary: Create the owner-signing message for a standing limit order
      description: Preflights current account, market, portfolio, and vault capacity before returning the owner-signing message. Capacity is checked again when a standing order is executed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [account_id, order_id, market_id, side, notional_usdc, leverage_bps, limit_price, expires_at_ms] }
      responses:
        '200': { description: Canonical order fields and owner-signing message }
        '422': { description: Invalid order terms. A risk_capacity_exceeded error includes error.allowed_max_notional_usdc in raw USDC units. }
  /v1/trade/limits/cancel/quote:
    post:
      tags: [Trading]
      operationId: createPerpLimitCancelAuthorization
      summary: Create the owner-signing message to cancel a standing order
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [account_id, order_id] }
      responses:
        '200': { description: Cancellation nonce, expiry, and signing message }
  /v1/trade/limits/cancel:
    post:
      tags: [Trading]
      operationId: cancelPerpLimitOrder
      summary: Cancel an owner-authorized standing order
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [account_id, order_id, nonce, expires_at_ms, message, owner_signature] }
      responses:
        '200': { description: Cancellation transaction finalized }
        '422': { description: Invalid or stale owner authorization }
components:
  schemas:
    OttoProviderStatus:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        model: { type: string, description: Configured model identifier; omitted when not configured. }
    CloseQuote:
      type: object
      required: [account_id, position_id, market_id, reference_price, max_slippage_bps, price_sequence, fee_bps, nonce, expires_at_ms, message, quote_signature]
      properties:
        account_id: { type: string }
        position_id: { type: string }
        market_id: { type: string }
        reference_price: { type: string }
        max_slippage_bps: { type: integer }
        price_sequence: { type: integer, format: uint64 }
        fee_bps: { type: integer }
        nonce: { type: integer, format: uint64 }
        expires_at_ms: { type: integer, format: uint64 }
        message: { type: string }
        quote_signature: { type: string, contentEncoding: base64 }
    TradeQuote:
      type: object
      required: [account_id, position_id, market_id, side, notional_usdc, leverage_bps, reference_price, max_slippage_bps, price_sequence, fee_bps, nonce, expires_at_ms, message, quote_signature, allowed_max_notional_usdc]
      properties:
        account_id: { type: string }
        position_id: { type: string }
        market_id: { type: string }
        side: { type: string, enum: [long, short] }
        notional_usdc: { type: string }
        leverage_bps: { type: integer }
        reference_price: { type: string, description: Raw price with 8 decimals }
        max_slippage_bps: { type: integer }
        price_sequence: { type: integer, format: uint64 }
        fee_bps: { type: integer }
        nonce: { type: integer, format: uint64 }
        expires_at_ms: { type: integer, format: uint64 }
        message: { type: string }
        quote_signature: { type: string, contentEncoding: base64 }
        required_margin_usdc: { type: string }
        fee_usdc: { type: string }
        free_balance_usdc: { type: string }
        allowed_max_notional_usdc: { type: string, description: Maximum additional notional allowed by current risk and payout limits, in raw USDC units }
    IndexerStatus:
      type: object
      required: [enabled, status, lastIndexedBlock]
      properties:
        enabled: { type: boolean }
        status: { type: string, enum: [disabled, starting, running, retrying, stopped] }
        lastIndexedBlock: { type: integer, format: uint64 }
        lastSuccessfulPollAtMs: { type: integer, format: uint64 }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            allowed_max_notional_usdc: { type: string, description: Present for risk_capacity_exceeded responses; raw USDC units with 6 decimals }
