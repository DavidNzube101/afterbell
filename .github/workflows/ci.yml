name: CI and publish image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afterbell-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-tidy cmake g++ git libcurl4-openssl-dev libjsoncpp-dev libpq-dev libssl-dev pkg-config uuid-dev zlib1g-dev
      - name: Install pinned Drogon with async stream support
        run: bash backend/scripts/install_drogon.sh

      - name: Configure
        run: cmake -S backend -B backend/build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DAFTERBELL_REQUIRE_DROGON=ON

      - name: Lint
        run: |
          mapfile -d '' sources < <(find backend/src backend/tests -type f -name '*.cpp' -print0 | sort -z)
          clang-tidy --checks='clang-analyzer-*,bugprone-*,performance-*' -p backend/build "${sources[@]}"

      - name: Unit tests
        run: |
          cmake --build backend/build --target afterbell-indexer-tests --parallel 2
          ctest --test-dir backend/build --output-on-failure

      - name: Build API and indexer
        run: cmake --build backend/build --target afterbell-api afterbell-indexer --parallel 2

  publish:
    name: Build and publish GHCR image
    needs: validate
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build image and publish on main
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Render deploy
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy published image when a hook is configured
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_NAME: ${{ needs.publish.outputs.image }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping Render deploy."
            exit 0
          fi

          export IMAGE_URL="${IMAGE_NAME}:${IMAGE_TAG}"
          encoded_image_url="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["IMAGE_URL"], safe=""))')"
          separator='?'
          case "$DEPLOY_HOOK_URL" in *\?*) separator='&' ;; esac
          curl --fail --silent --show-error --request POST \
            "${DEPLOY_HOOK_URL}${separator}imgURL=${encoded_image_url}"
