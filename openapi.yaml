---
openapi: 3.1.0
info:
  title: Afterbell API
  version: 1.0.0
  description: HTTP API for Afterbell market data, accounts, A1 trading and liquidity, Otto, notifications, and waitlist.
servers:
- url: http://localhost:8080
  description: Local C++ API
- url: https://api.afterbellfx.xyz
  description: Afterbell API
tags:
- name: Health
- name: Markets
- name: Trading
- name: Otto
- name: Waitlist
- name: Accounts
- name: Liquidity
paths:
  "/health/live":
    get:
      tags:
      - Health
      operationId: getLiveness
      summary: Check whether the API process is running
      responses:
        '200':
          description: API process is live
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    const: live
  "/health/ready":
    get:
      tags:
      - Health
      operationId: getReadiness
      summary: Check whether the API can reach PostgreSQL
      responses:
        '200':
          description: API and database are ready
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - database
                - indexer
                properties:
                  status:
                    type: string
                    const: ready
                  database:
                    type: string
                    const: ready
                  indexer:
                    "$ref": "#/components/schemas/IndexerStatus"
        '503':
          description: Database is unavailable
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - database
                - indexer
                - error
                properties:
                  status:
                    type: string
                    const: unavailable
                  database:
                    type: string
                    const: unavailable
                  indexer:
                    "$ref": "#/components/schemas/IndexerStatus"
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                        const: database_unavailable
                      message:
                        type: string
  "/v1/account/owner/status":
    post:
      tags:
      - Accounts
      operationId: getA1OwnerStatus
      summary: Check whether an A1 logical account has a registered owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              properties:
                account_id:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: Current owner state
          content:
            application/json:
              schema:
                type: object
                required:
                - account_id
                - registered
                properties:
                  account_id:
                    type: string
                  registered:
                    type: boolean
                  owner:
                    "$ref": "#/components/schemas/A1OwnerKey"
        '422':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/account/owner/payload":
    post:
      tags:
      - Accounts
      operationId: getA1OwnerRegistrationPayload
      summary: Fetch the exact domain-bound message that a wallet must sign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              - owner
              properties:
                account_id:
                  type: string
                  maxLength: 128
                owner:
                  "$ref": "#/components/schemas/A1OwnerKey"
      responses:
        '200':
          description: A1 signature payload
          content:
            application/json:
              schema:
                type: object
                required:
                - account_id
                - payload
                - expires_at_ms
                properties:
                  account_id:
                    type: string
                  expires_at_ms:
                    type: integer
                    format: int64
                  payload:
                    type: object
                    required:
                    - message
                    - nonce
                    - recipient
                    properties:
                      message:
                        type: string
                      nonce:
                        type: string
                        contentEncoding: base64
                      recipient:
                        type: string
        '422':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/account/owner/register":
    post:
      tags:
      - Accounts
      operationId: registerA1Owner
      summary: Relay a wallet-signed A1 owner registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              - owner
              - expires_at_ms
              - signature
              properties:
                account_id:
                  type: string
                  maxLength: 128
                owner:
                  "$ref": "#/components/schemas/A1OwnerKey"
                expires_at_ms:
                  type: integer
                  format: int64
                signature:
                  type: string
                  contentEncoding: base64
      responses:
        '200':
          description: Owner registered or already registered
          content:
            application/json:
              schema:
                type: object
                required:
                - account_id
                - status
                properties:
                  account_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - registered
                    - already_registered
                  storage_top_up_yocto:
                    type: string
                  storage_transaction_hash:
                    type: string
                  registration_transaction_hash:
                    type: string
        '422':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/account/agent/payload":
    post:
      tags:
      - Accounts
      operationId: getA1AgentSetupPayload
      summary: Build the owner-signable payload for creating an A1 agent record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/A1AgentSetupRequest"
      responses:
        '200':
          description: Agent setup signing payload
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - expires_at_ms
                - nonce
                - agent_record_id
                properties:
                  payload:
                    type: object
                    required:
                    - message
                    - nonce
                    - recipient
                    properties:
                      message:
                        type: string
                      nonce:
                        type: string
                        contentEncoding: base64
                      recipient:
                        type: string
                  expires_at_ms:
                    type: integer
                    format: int64
                  nonce:
                    type: integer
                    format: int64
                  agent_record_id:
                    type: string
        '422':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/account/agent/create":
    post:
      tags:
      - Accounts
      operationId: createA1AgentRecord
      summary: Relay an owner-signed A1 agent-record creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - "$ref": "#/components/schemas/A1AgentSetupRequest"
              - type: object
                required:
                - signature
                - expires_at_ms
                - nonce
                properties:
                  signature:
                    type: string
                    contentEncoding: base64
                  expires_at_ms:
                    type: integer
                    format: int64
                  nonce:
                    type: integer
                    format: int64
      responses:
        '200':
          description: Agent record created or already present
          content:
            application/json:
              schema:
                type: object
                required:
                - account_id
                - agent_record_id
                - status
                properties:
                  account_id:
                    type: string
                  agent_record_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - created
                    - already_created
                  transaction_hash:
                    type: string
        '422':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/account/username/claim":
    post:
      tags:
      - Accounts
      operationId: claimAccountUsername
      summary: Claim an unreserved username for a registered Afterbell account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              - username
              properties:
                account_id:
                  type: string
                  maxLength: 128
                username:
                  type: string
                  minLength: 3
                  maxLength: 20
                  pattern: "^[a-z0-9_]+$"
      responses:
        '200':
          description: Username claimed
          content:
            application/json:
              schema:
                type: object
                required:
                - username
                - status
                - reclaimed
                properties:
                  username:
                    type: string
                  status:
                    type: string
                    enum:
                    - claimed
                    - already_claimed
                  reclaimed:
                    type: boolean
                    const: false
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/account/username/check":
    get:
      tags:
      - Accounts
      operationId: checkAccountUsernameAvailability
      summary: Check username syntax and availability
      parameters:
      - name: account_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 128
      - name: username
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^[a-z0-9_]+$"
      responses:
        '200':
          description: Username availability
          content:
            application/json:
              schema:
                type: object
                required:
                - valid
                - available
                properties:
                  valid:
                    type: boolean
                  available:
                    type: boolean
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/account/username/reclaim":
    post:
      tags:
      - Accounts
      operationId: reclaimAccountUsername
      summary: Reclaim the username associated with a waitlist signup email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              - email
              properties:
                account_id:
                  type: string
                  maxLength: 128
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '200':
          description: Waitlist username reclaimed
          content:
            application/json:
              schema:
                type: object
                required:
                - username
                - status
                - reclaimed
                properties:
                  username:
                    type: string
                  status:
                    type: string
                    enum:
                    - claimed
                    - already_claimed
                  reclaimed:
                    type: boolean
                    const: true
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/waitlist/username/check":
    get:
      tags:
      - Waitlist
      operationId: checkUsername
      summary: Validate a username and report availability
      parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^[a-z0-9_]+$"
      responses:
        '200':
          description: Username check result
          content:
            application/json:
              schema:
                type: object
                required:
                - valid
                - available
                properties:
                  valid:
                    type: boolean
                  available:
                    type: boolean
                  reason:
                    type: string
                    enum:
                    - invalid_format
                    - reserved
                    - already_claimed
                    - already_joined
        '400':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/waitlist/username/claim":
    post:
      tags:
      - Waitlist
      operationId: claimUsername
      summary: Reserve a username for an email for 15 minutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ClaimUsernameRequest"
      responses:
        '201':
          description: Username reserved
          content:
            application/json:
              schema:
                type: object
                required:
                - claimed
                - expiresAt
                properties:
                  claimed:
                    type: boolean
                    const: true
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          "$ref": "#/components/responses/BadRequest"
        '409':
          "$ref": "#/components/responses/Conflict"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/waitlist/email/check":
    post:
      tags:
      - Waitlist
      operationId: checkEmail
      summary: Validate an email and check whether it has joined the waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CheckEmailRequest"
      responses:
        '200':
          description: Email check result
          content:
            application/json:
              schema:
                type: object
                required:
                - valid
                - available
                properties:
                  valid:
                    type: boolean
                  available:
                    type: boolean
                  reason:
                    type: string
                    enum:
                    - invalid_format
                    - already_joined
        '400':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/waitlist/join":
    post:
      tags:
      - Waitlist
      operationId: joinWaitlist
      summary: Complete a username reservation and join the waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JoinWaitlistRequest"
      responses:
        '201':
          description: Waitlist signup created
          content:
            application/json:
              schema:
                type: object
                required:
                - joined
                - username
                properties:
                  joined:
                    type: boolean
                    const: true
                  username:
                    type: string
        '400':
          "$ref": "#/components/responses/BadRequest"
        '409':
          "$ref": "#/components/responses/Conflict"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/health/status":
    get:
      tags:
      - Health
      operationId: getServiceStatus
      summary: Report API, database, and background indexer status
      description: Indexer errors are reported here while the HTTP API remains ready if PostgreSQL is available.
      responses:
        '200':
          description: Current service component status
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - api
                - database
                - indexer
                properties:
                  status:
                    type: string
                    enum:
                    - ready
                    - degraded
                  api:
                    type: string
                    const: running
                  database:
                    type: string
                    enum:
                    - ready
                    - unavailable
                  indexer:
                    "$ref": "#/components/schemas/IndexerStatus"
  "/v1/markets":
    get:
      tags:
      - Markets
      operationId: listMarkets
      summary: List configured Robinhood Chain stock markets
      description: >-
        Lists the configured synthetic US equity markets and their source metadata. Whether trade routes are enabled is reported
        in the response.
      responses:
        '200':
          description: Configured market registry
          content:
            application/json:
              schema:
                type: object
                required:
                - network
                - contractId
                - markets
                - tradingEnabled
                properties:
                  network:
                    type: string
                    enum:
                    - testnet
                    - mainnet
                  contractId:
                    type: string
                  tradingEnabled:
                    type: boolean
                  markets:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - symbol
                      - baseAsset
                      - quoteAsset
                      - sourceChain
                      - sourceChainId
                      - tokenAddress
                      - status
                      - tradingEnabled
                      properties:
                        id:
                          type: string
                          example: NVDA
                        symbol:
                          type: string
                          example: NVDA
                        baseAsset:
                          type: string
                        quoteAsset:
                          type: string
                          const: USDC
                        sourceChain:
                          type: string
                          const: robinhood
                        sourceChainId:
                          type: integer
                          const: 4663
                        tokenAddress:
                          type: string
                        status:
                          type: string
                        tradingEnabled:
                          type: boolean
  "/v1/otto/providers":
    get:
      tags:
      - Otto
      operationId: getOttoProviders
      summary: Get configured Otto provider availability
      responses:
        '200':
          description: Provider availability and configured model IDs; API keys are never returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  near_ai:
                    "$ref": "#/components/schemas/OttoProviderStatus"
                  qwen:
                    "$ref": "#/components/schemas/OttoProviderStatus"
                  byok:
                    "$ref": "#/components/schemas/OttoProviderStatus"
  "/v1/otto/chat":
    post:
      tags:
      - Otto
      operationId: streamOttoChat
      summary: Stream an Otto response
      description: >-
        Requires a short-lived Bearer wallet session from the Otto session endpoints. Streams chat deltas as Server-Sent Events.
        Platform API keys stay server-side; BYOK credentials are request-scoped and are not persisted. Rate limits are enforced
        per verified wallet account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - provider
              - market_id
              - messages
              properties:
                provider:
                  type: string
                  enum:
                  - near_ai
                  - qwen
                  - byok
                market_id:
                  type: string
                  enum:
                  - AAPL
                  - GOOGL
                  - META
                  - NVDA
                  - TSLA
                messages:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required:
                    - role
                    - content
                    properties:
                      role:
                        type: string
                        enum:
                        - user
                        - assistant
                      content:
                        type: string
                        maxLength: 4000
                base_url:
                  type: string
                  description: Required for BYOK; HTTPS only
                  port 443:
                  public DNS host:
                  root or /v1 path.:
                model:
                  type: string
                  description: Required for BYOK.
                api_key:
                  type: string
                  writeOnly: true
                  description: Required for BYOK; request-scoped and never persisted.
      responses:
        '200':
          description: Server-Sent Events; event names are delta, done, and error.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid provider, market, or message payload.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '429':
          description: Otto request limit reached for the supplied account ID.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '503':
          description: Selected platform provider is not configured.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
      - ottoWalletSession: []
  "/v1/trade/quote":
    post:
      tags:
      - Trading
      operationId: createPerpOpenQuote
      summary: Create an A1-signed market-open quote
      description: >-
        Returns the exact A1 authorization message for the owner wallet to sign, along with the configured quote signer signature.
        The backend preflights current account, market, portfolio, and vault capacity before returning a quote. Amounts are
        raw USDC units (6 decimals). The quote expires quickly and is bound to the current oracle sequence and trading nonce.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              - market_id
              - side
              - notional_usdc
              - leverage_bps
              - max_slippage_bps
              properties:
                account_id:
                  type: string
                market_id:
                  type: string
                  example: NVDA
                side:
                  type: string
                  enum:
                  - long
                  - short
                notional_usdc:
                  type: string
                  pattern: "^[0-9]+$"
                  example: '10000000'
                leverage_bps:
                  type: integer
                  minimum: 10000
                  example: 20000
                max_slippage_bps:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  example: 50
      responses:
        '200':
          description: Quote and owner-signing message
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TradeQuote"
        '422':
          description: >-
            Market, oracle, account, balance, or request validation failed. A risk_capacity_exceeded error includes error.allowed_max_notional_usdc
            in raw USDC units.
  "/v1/trade/open":
    post:
      tags:
      - Trading
      operationId: submitPerpOpen
      summary: Relay an owner-authorized A1 market order
      description: >-
        Send the quote fields returned by /v1/trade/quote plus the owner's base64 wallet signature. The backend checks that
        the quote is still current, applies the configured quote signer signature, and relays open_perp_position to A1. A1
        remains authoritative for signature verification and settlement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - "$ref": "#/components/schemas/TradeQuote"
              - type: object
                required:
                - owner_signature
                properties:
                  owner_signature:
                    type: string
                    contentEncoding: base64
      responses:
        '200':
          description: NEAR transaction finalized
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - transaction_hash
                - position_id
                properties:
                  status:
                    type: string
                    const: finalized
                  transaction_hash:
                    type: string
                  position_id:
                    type: string
        '422':
          description: Quote expired or A1 rejected the trade
        '503':
          description: Trade routes are disabled
  "/v1/trade/positions":
    get:
      tags:
      - Trading
      operationId: listPerpPositions
      summary: List the current A1 positions for a logical account
      parameters:
      - name: account_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current positions, with indicative PnL when a market mark exists
          content:
            application/json:
              schema:
                type: object
                required:
                - account_id
                - positions
                properties:
                  account_id:
                    type: string
                  positions:
                    type: array
                    items:
                      type: object
  "/v1/trade/close/quote":
    post:
      tags:
      - Trading
      operationId: createPerpCloseQuote
      summary: Create an A1-signed position close quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              - position_id
              - max_slippage_bps
              properties:
                account_id:
                  type: string
                position_id:
                  type: string
                max_slippage_bps:
                  type: integer
                  minimum: 0
                  maximum: 1000
      responses:
        '200':
          description: Quote and owner-signing message
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CloseQuote"
        '422':
          description: Position or oracle validation failed
  "/v1/trade/close":
    post:
      tags:
      - Trading
      operationId: submitPerpClose
      summary: Relay an owner-authorized position close
      description: >-
        Send the close quote plus the owner's base64 wallet signature. The backend rechecks current position, mark, sequence
        and nonce before relaying close_perp_position to A1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - "$ref": "#/components/schemas/CloseQuote"
              - type: object
                required:
                - owner_signature
                properties:
                  owner_signature:
                    type: string
                    contentEncoding: base64
      responses:
        '200':
          description: Close transaction finalized
        '422':
          description: Quote expired or A1 rejected the close
        '503':
          description: Trade routes are disabled
  "/v1/trade/limits":
    get:
      tags:
      - Trading
      operationId: listPerpLimitOrders
      summary: List standing limit orders for a logical account
      parameters:
      - name: account_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Standing orders recorded by A1
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: object
    post:
      tags:
      - Trading
      operationId: submitPerpLimitOrder
      summary: Place a wallet-authorized standing limit order
      description: >-
        Submit the fields returned by /v1/trade/limits/quote and the owner's signature. A1 stores the authorization. A backend
        keeper submits it when the A1 mark reaches its limit. No margin is reserved while it waits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              - order_id
              - market_id
              - side
              - notional_usdc
              - leverage_bps
              - limit_price
              - nonce
              - expires_at_ms
              - message
              - owner_signature
      responses:
        '200':
          description: Limit order stored on A1
        '422':
          description: Invalid or stale authorization
  "/v1/trade/limits/quote":
    post:
      tags:
      - Trading
      operationId: createPerpLimitOrderAuthorization
      summary: Create the owner-signing message for a standing limit order
      description: >-
        Preflights current account, market, portfolio, and vault capacity before returning the owner-signing message. Capacity
        is checked again when a standing order is executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              - order_id
              - market_id
              - side
              - notional_usdc
              - leverage_bps
              - limit_price
              - expires_at_ms
      responses:
        '200':
          description: Canonical order fields and owner-signing message
        '422':
          description: Invalid order terms. A risk_capacity_exceeded error includes error.allowed_max_notional_usdc in raw
            USDC units.
  "/v1/trade/limits/cancel/quote":
    post:
      tags:
      - Trading
      operationId: createPerpLimitCancelAuthorization
      summary: Create the owner-signing message to cancel a standing order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              - order_id
      responses:
        '200':
