openapi: 3.1.0
info:
  title: Afterbell Public API
  version: 0.1.0
  description: Afterbell health, account, trading, and waitlist API.
servers:
  - url: http://localhost:3001
    description: Local development
tags:
  - name: Health
  - name: Waitlist
  - name: Accounts
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the API process is running
      responses:
        '200':
          description: API process is live
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: live }
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether the API can reach PostgreSQL
      responses:
        '200':
          description: API and database are ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/account/owner/status:
    post:
      tags: [Accounts]
      operationId: getA1OwnerStatus
      summary: Check whether an A1 logical account has a registered owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id]
              properties:
                account_id: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Current owner state
          content:
            application/json:
              schema:
                type: object
                required: [account_id, registered]
                properties:
                  account_id: { type: string }
                  registered: { type: boolean }
                  owner: { $ref: '#/components/schemas/A1OwnerKey' }
        '422': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/account/owner/payload:
    post:
      tags: [Accounts]
      operationId: getA1OwnerRegistrationPayload
      summary: Fetch the exact domain-bound message that a wallet must sign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, owner]
              properties:
                account_id: { type: string, maxLength: 128 }
                owner: { $ref: '#/components/schemas/A1OwnerKey' }
      responses:
        '200':
          description: A1 signature payload
          content:
            application/json:
              schema:
                type: object
                required: [account_id, payload, expires_at_ms]
                properties:
                  account_id: { type: string }
                  expires_at_ms: { type: integer, format: int64 }
                  payload:
                    type: object
                    required: [message, nonce, recipient]
                    properties:
                      message: { type: string }
                      nonce: { type: string, contentEncoding: base64 }
                      recipient: { type: string }
        '422': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/account/owner/register:
    post:
      tags: [Accounts]
      operationId: registerA1Owner
      summary: Relay a wallet-signed A1 owner registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, owner, expires_at_ms, signature]
              properties:
                account_id: { type: string, maxLength: 128 }
                owner: { $ref: '#/components/schemas/A1OwnerKey' }
                expires_at_ms: { type: integer, format: int64 }
                signature: { type: string, contentEncoding: base64 }
      responses:
        '200':
          description: Owner registered or already registered
          content:
            application/json:
              schema:
                type: object
                required: [account_id, status]
                properties:
                  account_id: { type: string }
                  status: { type: string, enum: [registered, already_registered] }
                  storage_top_up_yocto: { type: string }
                  storage_transaction_hash: { type: string }
                  registration_transaction_hash: { type: string }
        '422': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/account/agent/payload:
    post:
      tags: [Accounts]
      operationId: getA1AgentSetupPayload
      summary: Build the owner-signable payload for creating an A1 agent record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A1AgentSetupRequest'
      responses:
        '200':
          description: Agent setup signing payload
          content:
            application/json:
              schema:
                type: object
                required: [payload, expires_at_ms, nonce, agent_record_id]
                properties:
                  payload:
                    type: object
                    required: [message, nonce, recipient]
                    properties:
                      message: { type: string }
                      nonce: { type: string, contentEncoding: base64 }
                      recipient: { type: string }
                  expires_at_ms: { type: integer, format: int64 }
                  nonce: { type: integer, format: int64 }
                  agent_record_id: { type: string }
        '422': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/account/agent/create:
    post:
      tags: [Accounts]
      operationId: createA1AgentRecord
      summary: Relay an owner-signed A1 agent-record creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/A1AgentSetupRequest'
                - type: object
                  required: [signature, expires_at_ms, nonce]
                  properties:
                    signature: { type: string, contentEncoding: base64 }
                    expires_at_ms: { type: integer, format: int64 }
                    nonce: { type: integer, format: int64 }
      responses:
        '200':
          description: Agent record created or already present
          content:
            application/json:
              schema:
                type: object
                required: [account_id, agent_record_id, status]
                properties:
                  account_id: { type: string }
                  agent_record_id: { type: string }
                  status: { type: string, enum: [created, already_created] }
                  transaction_hash: { type: string }
        '422': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/account/username/claim:
    post:
      tags: [Accounts]
      operationId: claimAccountUsername
      summary: Claim an unreserved username for a registered Afterbell account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, username]
              properties:
                account_id: { type: string, maxLength: 128 }
                username: { type: string, minLength: 3, maxLength: 20, pattern: '^[a-z0-9_]+$' }
      responses:
        '200':
          description: Username claimed
          content:
            application/json:
              schema:
                type: object
                required: [username, status, reclaimed]
                properties:
                  username: { type: string }
                  status: { type: string, enum: [claimed, already_claimed] }
                  reclaimed: { type: boolean, const: false }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/account/username/reclaim:
    post:
      tags: [Accounts]
      operationId: reclaimAccountUsername
      summary: Reclaim the username associated with a waitlist signup email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, email]
              properties:
                account_id: { type: string, maxLength: 128 }
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '200':
          description: Waitlist username reclaimed
          content:
            application/json:
              schema:
                type: object
                required: [username, status, reclaimed]
                properties:
                  username: { type: string }
                  status: { type: string, enum: [claimed, already_claimed] }
                  reclaimed: { type: boolean, const: true }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/waitlist/username/check:
    get:
      tags: [Waitlist]
      operationId: checkUsername
      summary: Validate a username and report availability
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 20
            pattern: '^[a-z0-9_]+$'
      responses:
        '200':
          description: Username check result
          content:
            application/json:
              schema:
                type: object
                required: [valid, available]
                properties:
                  valid: { type: boolean }
                  available: { type: boolean }
                  reason:
                    type: string
                    enum: [invalid_format, reserved, already_claimed, already_joined]
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/waitlist/username/claim:
    post:
      tags: [Waitlist]
      operationId: claimUsername
      summary: Reserve a username for an email for 15 minutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimUsernameRequest'
      responses:
        '201':
          description: Username reserved
          content:
            application/json:
              schema:
                type: object
                required: [claimed, expiresAt]
                properties:
                  claimed: { type: boolean, const: true }
                  expiresAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/waitlist/email/check:
    post:
      tags: [Waitlist]
      operationId: checkEmail
      summary: Validate an email and check whether it has joined the waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckEmailRequest'
      responses:
        '200':
          description: Email check result
          content:
            application/json:
              schema:
                type: object
                required: [valid, available]
                properties:
                  valid: { type: boolean }
                  available: { type: boolean }
                  reason:
                    type: string
                    enum: [invalid_format, already_joined]
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/waitlist/join:
    post:
      tags: [Waitlist]
      operationId: joinWaitlist
      summary: Complete a username reservation and join the waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinWaitlistRequest'
      responses:
        '201':
          description: Waitlist signup created
          content:
            application/json:
              schema:
                type: object
                required: [joined, username]
                properties:
                  joined: { type: boolean, const: true }
                  username: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    A1OwnerKey:
      oneOf:
        - type: object
          required: [SolanaEd25519]
          properties:
            SolanaEd25519:
              type: object
              required: [public_key]
              properties:
                public_key: { type: array, minItems: 32, maxItems: 32, items: { type: integer, minimum: 0, maximum: 255 } }
        - type: object
          required: [Ethereum]
          properties:
            Ethereum:
              type: object
              required: [address]
              properties:
                address: { type: array, minItems: 20, maxItems: 20, items: { type: integer, minimum: 0, maximum: 255 } }
        - type: object
          required: [NearEd25519]
          properties:
            NearEd25519:
              type: object
              required: [public_key]
              properties:
                public_key: { type: array, minItems: 32, maxItems: 32, items: { type: integer, minimum: 0, maximum: 255 } }
    A1AgentSetupRequest:
      type: object
      required: [account_id, agent_record_id, agent_key, allowed_markets, max_position_usdc, max_open_notional_usdc, max_leverage_bps, max_allocation_usdc, max_daily_loss_usdc, access_duration_days]
      properties:
        account_id: { type: string, maxLength: 128 }
        agent_record_id: { type: string, maxLength: 128 }
        agent_key: { $ref: '#/components/schemas/A1AgentKey' }
        allowed_markets: { type: array, minItems: 1, maxItems: 32, items: { type: string, maxLength: 32 } }
        max_position_usdc: { type: string, pattern: '^[0-9]+$' }
        max_open_notional_usdc: { type: string, pattern: '^[0-9]+$' }
        max_leverage_bps: { type: integer, minimum: 10000, maximum: 50000 }
        max_allocation_usdc: { type: string, pattern: '^[0-9]+$' }
        max_daily_loss_usdc: { type: string, pattern: '^[0-9]+$' }
        access_duration_days: { type: integer, minimum: 1, maximum: 30 }
    A1AgentKey:
      type: object
      required: [NearEd25519]
      properties:
        NearEd25519:
          type: object
          required: [public_key]
          properties:
            public_key: { type: array, minItems: 32, maxItems: 32, items: { type: integer, minimum: 0, maximum: 255 } }
    ClaimUsernameRequest:
      type: object
      additionalProperties: false
      required: [username, email]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-z0-9_]+$'
        email:
          type: string
          format: email
          maxLength: 254
    CheckEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    JoinWaitlistRequest:
      allOf:
        - $ref: '#/components/schemas/ClaimUsernameRequest'
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Username or email is unavailable, or its reservation expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required service is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
