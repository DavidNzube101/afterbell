components:
  schemas:
    A1OwnerKey:
      oneOf:
      - type: object
        required:
        - SolanaEd25519
        properties:
          SolanaEd25519:
            type: object
            required:
            - public_key
            properties:
              public_key:
                type: array
                minItems: 32
                maxItems: 32
                items:
                  type: integer
                  minimum: 0
                  maximum: 255
      - type: object
        required:
        - Ethereum
        properties:
          Ethereum:
            type: object
            required:
            - address
            properties:
              address:
                type: array
                minItems: 20
                maxItems: 20
                items:
                  type: integer
                  minimum: 0
                  maximum: 255
      - type: object
        required:
        - NearEd25519
        properties:
          NearEd25519:
            type: object
            required:
            - public_key
            properties:
              public_key:
                type: array
                minItems: 32
                maxItems: 32
                items:
                  type: integer
                  minimum: 0
                  maximum: 255
    A1AgentSetupRequest:
      type: object
      required:
      - account_id
      - agent_record_id
      - agent_key
      - allowed_markets
      - max_position_usdc
      - max_open_notional_usdc
      - max_leverage_bps
      - max_allocation_usdc
      - max_daily_loss_usdc
      - access_duration_days
      properties:
        account_id:
          type: string
          maxLength: 128
        agent_record_id:
          type: string
          maxLength: 128
        agent_key:
          "$ref": "#/components/schemas/A1AgentKey"
        allowed_markets:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            maxLength: 32
        max_position_usdc:
          type: string
          pattern: "^[0-9]+$"
        max_open_notional_usdc:
          type: string
          pattern: "^[0-9]+$"
        max_leverage_bps:
          type: integer
          minimum: 10000
          maximum: 50000
        max_allocation_usdc:
          type: string
          pattern: "^[0-9]+$"
        max_daily_loss_usdc:
          type: string
          pattern: "^[0-9]+$"
        access_duration_days:
          type: integer
          minimum: 1
          maximum: 30
    A1AgentKey:
      type: object
      required:
      - NearEd25519
      properties:
        NearEd25519:
          type: object
          required:
          - public_key
          properties:
            public_key:
              type: array
              minItems: 32
              maxItems: 32
              items:
                type: integer
                minimum: 0
                maximum: 255
    ClaimUsernameRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - email
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^[a-z0-9_]+$"
        email:
          type: string
          format: email
          maxLength: 254
    CheckEmailRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    JoinWaitlistRequest:
      allOf:
      - "$ref": "#/components/schemas/ClaimUsernameRequest"
    OttoProviderStatus:
      type: object
      required:
      - available
      properties:
        available:
          type: boolean
        model:
          type: string
          description: Configured model identifier; omitted when not configured.
    CloseQuote:
      type: object
      required:
      - account_id
      - position_id
      - market_id
      - reference_price
      - max_slippage_bps
      - price_sequence
      - fee_bps
      - nonce
      - expires_at_ms
      - message
      - quote_signature
      properties:
        account_id:
          type: string
        position_id:
          type: string
        market_id:
          type: string
        reference_price:
          type: string
        max_slippage_bps:
          type: integer
        price_sequence:
          type: integer
          format: uint64
        fee_bps:
          type: integer
        nonce:
          type: integer
          format: uint64
        expires_at_ms:
          type: integer
          format: uint64
        message:
          type: string
        quote_signature:
          type: string
          contentEncoding: base64
    TradeQuote:
      type: object
      required:
      - account_id
      - position_id
      - market_id
      - side
      - notional_usdc
      - leverage_bps
      - reference_price
      - max_slippage_bps
      - price_sequence
      - fee_bps
      - nonce
      - expires_at_ms
      - message
      - quote_signature
      - allowed_max_notional_usdc
      properties:
        account_id:
          type: string
        position_id:
          type: string
        market_id:
          type: string
        side:
          type: string
          enum:
          - long
          - short
        notional_usdc:
          type: string
        leverage_bps:
          type: integer
        reference_price:
          type: string
          description: Raw price with 8 decimals
        max_slippage_bps:
          type: integer
        price_sequence:
          type: integer
          format: uint64
        fee_bps:
          type: integer
        nonce:
          type: integer
          format: uint64
        expires_at_ms:
          type: integer
          format: uint64
        message:
          type: string
        quote_signature:
          type: string
          contentEncoding: base64
        required_margin_usdc:
          type: string
        fee_usdc:
          type: string
        free_balance_usdc:
          type: string
        allowed_max_notional_usdc:
          type: string
          description: Maximum additional notional allowed by current risk and payout limits
          in raw USDC units:
    IndexerStatus:
      type: object
      required:
      - enabled
      - status
      - lastIndexedBlock
      properties:
        enabled:
          type: boolean
        status:
          type: string
          enum:
          - disabled
          - starting
          - running
          - retrying
          - stopped
        lastIndexedBlock:
          type: integer
          format: uint64
        lastSuccessfulPollAtMs:
          type: integer
          format: uint64
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            allowed_max_notional_usdc:
              type: string
              description: Present for risk_capacity_exceeded responses; raw USDC units with 6 decimals
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: Username or email is unavailable, or its reservation expired
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required service is unavailable
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
  securitySchemes:
    ottoWalletSession:
      type: http
      scheme: bearer
      bearerFormat: Otto wallet session
