[package]
name = "afterbell-account-factory-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.17.2", features = ["legacy", "unstable"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.17.2", features = ["legacy", "unit-testing", "unstable"] }
ed25519-dalek = "2.2"
